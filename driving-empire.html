<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driving Empire</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#08111f; color:#f8fafc; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
    .card { background:#111827; border:1px solid #334155; border-radius:16px; padding:20px; }
    button { padding:10px 14px; border:none; border-radius:999px; background:#38bdf8; color:#0f172a; font-weight:700; cursor:pointer; }
    canvas { width:100%; border-radius:12px; background:#0f172a; margin-top:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Driving Empire</h1>
      <p>Race through checkpoints, collect coins, and beat the traffic.</p>
      <button id="startBtn">Start</button>
      <a href="index.html" style="color:#38bdf8; margin-left:10px;">Back to hub</a>
      <canvas id="game" width="800" height="420"></canvas>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const car = { x: 80, y: 200, w: 28, h: 18, speed: 3.2, score: 0 };
    const keys = {};
    const coins = Array.from({ length: 6 }, (_, i) => ({ x: 140 + i * 110, y: 90 + (i % 2) * 120, r: 8, collected: false }));
    let running = false;
    function reset() {
      car.x = 80; car.y = 200; car.score=0; coins.forEach(c=>c.collected=false); running=false;
      draw();
    }
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#475569'; ctx.fillRect(0,0,canvas.width,40); ctx.fillRect(0,canvas.height-40,canvas.width,40);
      ctx.fillStyle='#fbbf24'; coins.forEach(c=>!c.collected && ctx.fillRect(c.x-8,c.y-8,16,16));
      ctx.fillStyle='#38bdf8'; ctx.fillRect(car.x,car.y,car.w,car.h);
      ctx.fillStyle='#f8fafc'; ctx.font='16px Arial'; ctx.fillText(`Coins: ${car.score}`, 20, 24);
    }
    function tick() {
      if (running) {
        if (keys['ArrowLeft'] || keys['a']) car.x -= car.speed;
        if (keys['ArrowRight'] || keys['d']) car.x += car.speed;
        if (keys['ArrowUp'] || keys['w']) car.y -= car.speed;
        if (keys['ArrowDown'] || keys['s']) car.y += car.speed;
        car.x = Math.max(0, Math.min(canvas.width-30, car.x));
        car.y = Math.max(40, Math.min(canvas.height-60, car.y));
        coins.forEach(c=>{ if(!c.collected && Math.abs(car.x+14-c.x)<20 && Math.abs(car.y+9-c.y)<20){ c.collected=true; car.score+=1; } });
        if (car.score >= 3) { running=false; ctx.fillStyle='#fef3c7'; ctx.font='20px Arial'; ctx.fillText('You won the empire!', 240, 200); }
      }
      draw();
      requestAnimationFrame(tick);
    }
    window.addEventListener('keydown', e=>{ keys[e.key]=true; e.preventDefault(); });
    window.addEventListener('keyup', e=>{ keys[e.key]=false; });
    startBtn.addEventListener('click', ()=>{ running=true; draw(); });
    window.addEventListener('load', ()=>{ reset(); requestAnimationFrame(tick); });
  </script>
</body>
</html>
