<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ro2b Parkour</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a1a2e; color:#f8fafc; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
    .card { background:#16213e; border:1px solid #0f3460; border-radius:16px; padding:20px; }
    button { padding:10px 14px; border:none; border-radius:999px; background:#e94560; color:#fff; font-weight:700; cursor:pointer; }
    canvas { width:100%; border-radius:12px; background:#0f172a; margin-top:12px; }
    a { color:#e94560; margin-left:10px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Ro2b Parkour</h1>
      <p>Jump over obstacles and reach the end of the course. Use ARROW KEYS or WASD.</p>
      <button id="startBtn">Start</button>
      <a href="index.html">Back to hub</a>
      <canvas id="game" width="800" height="400"></canvas>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    
    let player = { x: 60, y: 300, w: 20, h: 30, vel: 0, jumping: false, score: 0 };
    let platforms = [];
    let obstacles = [];
    let running = false;
    let gravity = 0.6;
    const keys = {};
    
    function createLevel() {
      platforms = [
        { x: 0, y: 360, w: 800, h: 40 },
        { x: 180, y: 300, w: 100, h: 20 },
        { x: 350, y: 260, w: 100, h: 20 },
        { x: 520, y: 300, w: 100, h: 20 },
        { x: 700, y: 240, w: 100, h: 20 }
      ];
      obstacles = [
        { x: 250, y: 270, w: 30, h: 30 },
        { x: 450, y: 230, w: 30, h: 30 },
        { x: 620, y: 270, w: 30, h: 30 }
      ];
    }
    
    function reset() {
      player = { x: 60, y: 300, w: 20, h: 30, vel: 0, jumping: false, score: 0 };
      createLevel();
      running = false;
      draw();
    }
    
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Platforms
      ctx.fillStyle = '#38bdf8';
      platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
      
      // Obstacles
      ctx.fillStyle = '#ef4444';
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
      
      // Player
      ctx.fillStyle = '#e94560';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      
      // Score
      ctx.fillStyle = '#f8fafc';
      ctx.font = '16px Arial';
      ctx.fillText(`Progress: ${Math.floor(player.score)}%`, 20, 24);
    }
    
    function update() {
      if (!running) return;
      
      // Horizontal movement
      if (keys['ArrowLeft'] || keys['a']) player.x -= 4;
      if (keys['ArrowRight'] || keys['d']) player.x += 4;
      
      // Gravity and jumping
      player.vel += gravity;
      player.y += player.vel;
      
      // Platform collision
      let onPlatform = false;
      platforms.forEach(p => {
        if (player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 5 &&
            player.x + player.w > p.x && player.x < p.x + p.w) {
          player.y = p.y - player.h;
          player.vel = 0;
          player.jumping = false;
          onPlatform = true;
        }
      });
      
      // Jump
      if ((keys['ArrowUp'] || keys['w']) && !player.jumping && onPlatform) {
        player.vel = -12;
        player.jumping = true;
      }
      
      // Obstacle collision
      obstacles.forEach(o => {
        if (player.x < o.x + o.w && player.x + player.w > o.x &&
            player.y < o.y + o.h && player.y + player.h > o.y) {
          running = false;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fef3c7';
          ctx.font = '24px Arial';
          ctx.fillText('Game Over!', 340, 180);
          ctx.font = '16px Arial';
          ctx.fillText(`Final Progress: ${Math.floor(player.score)}%`, 310, 220);
        }
      });
      
      // Boundaries
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      if (player.y > canvas.height) running = false;
      
      // Progress
      player.score = Math.max(player.score, (player.x / canvas.width) * 100);
      
      // Win condition
      if (player.x > canvas.width - 40) {
        running = false;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fef3c7';
        ctx.font = '24px Arial';
        ctx.fillText('You completed the parkour!', 250, 180);
      }
    }
    
    function tick() {
      update();
      draw();
      requestAnimationFrame(tick);
    }
    
    window.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.key] = false; });
    startBtn.addEventListener('click', () => { running = true; reset(); });
    
    window.addEventListener('load', () => { reset(); requestAnimationFrame(tick); });
  </script>
</body>
</html>
